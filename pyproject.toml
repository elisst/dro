[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DRO"
version = "0.1.0"
description = "Code for DRO project"
authors = [
    {name = "Elis Stefansson"},
    {name = "David Vävinggren"},
    {name = "Antônio H. Ribeiro"}
]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "cvxpy>=1.9.2",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/elisst/dro"
